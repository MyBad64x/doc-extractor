[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-extractor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ollama", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "faker"]

[tool.setuptools.packages.find]
where = ["src"]